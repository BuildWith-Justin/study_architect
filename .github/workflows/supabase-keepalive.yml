name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (several database requests)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY secret is missing or empty"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          FAILED=0

          for i in 1 2 3; do
            STATUS=$(curl -s -o response.txt -w "%{http_code}" \
              -X POST "$BASE/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "write ping $i -> HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              FAILED=1
              cat response.txt
              echo ""
            fi
            sleep 3
          done

          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            "$BASE/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "read ping -> HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            FAILED=1
            cat response.txt
            echo ""
          fi

          if [ "$FAILED" -eq 0 ]; then
            echo "Ping OK"
          else
            echo "Ping FAILED"
            exit 1
          fi
